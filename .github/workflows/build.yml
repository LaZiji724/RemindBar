name: 构建与自测

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift 版本
        run: swift --version
      - name: 编译
        run: swift build
      - name: 离线自测
        run: swift run remind-selftest
      - name: 打包 App
        run: |
          Tools/package_app.sh
          cd dist && ditto -c -k --sequesterRsrc --keepParent "提醒条.app" "RemindBar-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RemindBar-macOS
          path: dist/RemindBar-macOS.zip
          retention-days: 14
      - name: 发布安装包到 Release（只在打版本标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/RemindBar-macOS.zip "dist/RemindBar-${GITHUB_REF_NAME}-macOS.zip"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "提醒条 $GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" "dist/RemindBar-${GITHUB_REF_NAME}-macOS.zip" --clobber
