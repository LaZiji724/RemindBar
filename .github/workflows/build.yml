name: 构建与自测

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift 版本
        run: swift --version
      - name: 编译
        run: swift build
      - name: 离线自测
        run: swift run remind-selftest
      - name: 打包 App
        run: |
          Tools/package_app.sh
          cd dist && ditto -c -k --sequesterRsrc --keepParent "提醒条.app" "RemindBar-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RemindBar-macOS
          path: dist/RemindBar-macOS.zip
          retention-days: 14
